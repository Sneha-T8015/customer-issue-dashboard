{% extends "base.html" %}
{% block title %}{{ 'Edit' if agent else 'New' }} Agent - Helpdesk{% endblock %}

{% block content %}
<div class="form-card">
    <h2>{{ 'Edit Agent: ' ~ agent.name if agent else 'Add New Agent' }}</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required value="{{ agent.name if agent else '' }}" placeholder="Full name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required value="{{ agent.email if agent else '' }}" placeholder="agent@company.com">
        </div>

        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role">
                {% for r in agent_roles %}
                <option value="{{ r }}" {% if agent and agent.role == r %}selected{% elif not agent and r == 'Agent' %}selected{% endif %}>{{ r }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ 'Update' if agent else 'Create' }} Agent</button>
            <a href="{{ url_for('agents_list') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
